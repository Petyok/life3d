# Shared counters API (server/stats.py, systemd unit life-stats). Pages report
# every 15 s, so 2 r/s per IP with a small burst is plenty.
limit_req_zone $binary_remote_addr zone=lifestats:1m rate=2r/s;

server {
    server_name life.petruha.ge;

    root /var/www/life.petruha.ge;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
    gzip_static on; # deploy.sh ships .gz files made with gzip -9

    location /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/life.petruha.ge;
    }

    # Vite emits content-hashed files here: cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        limit_req zone=lifestats burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/life.petruha.ge/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/life.petruha.ge/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = life.petruha.ge) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name life.petruha.ge;
    return 404; # managed by Certbot


}